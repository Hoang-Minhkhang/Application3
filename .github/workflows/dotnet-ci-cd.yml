name: Build .NET Framework Application3

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Restore NuGet packages
        shell: cmd
        run: |
          nuget restore Application3\packages.config -PackagesDirectory packages -Source https://api.nuget.org/v3/index.json -Verbosity detailed

      - name: Verify packages folder
        shell: cmd
        run: |
          echo Checking packages folder...
          if exist packages (
            echo Packages folder exists
            dir packages
          ) else (
            echo ERROR: packages folder not found
            exit /b 1
          )

      - name: Verify PdfiumViewer
        shell: cmd
        run: |
          set pdfiumPath=packages\PdfiumViewer.2.13.0.0\lib\net20\PdfiumViewer.dll
          if exist "%pdfiumPath%" (
            echo PdfiumViewer.dll found
          ) else (
            echo ERROR: PdfiumViewer.dll NOT found at %pdfiumPath%
            dir packages /s /b | findstr "PdfiumViewer"
            exit /b 1
          )

      - name: Build with MSBuild
        run: |
          msbuild Application3\Application3.csproj /p:Configuration=Release /p:Platform=AnyCPU /m