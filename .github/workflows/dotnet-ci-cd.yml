name: Build .NET Framework Application3

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            packages
          key: nuget-packages-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
          restore-keys: |
            nuget-packages-${{ runner.os }}-

      - name: Restore NuGet packages (solution or project)
        shell: powershell
        run: |
          Write-Host "Attempting to restore using solution if present, otherwise restore project."
          if (Test-Path Application3.slnx) {
            Write-Host "Restoring Application3.slnx -> packages"
            nuget restore Application3.slnx -PackagesDirectory packages
          } else {
            Write-Host "Restoring Application3/Application3.csproj -> packages"
            nuget restore Application3/Application3.csproj -PackagesDirectory packages
          }

      - name: Verify packages folder
        shell: powershell
        run: |
          Write-Host "List packages directory (top-level):"
          if (Test-Path packages) {
            Get-ChildItem -Path packages -Depth 2 | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "packages directory not found"
          }
          Write-Host "Check for PdfiumViewer folder(s):"
          Get-ChildItem -Path packages -Filter "PdfiumViewer*" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Build with MSBuild
        run: |
          # NOTE: Platform must match the Platform used in the .csproj Condition (AnyCPU, no space)
          msbuild Application3/Application3.csproj /p:Configuration=Release /p:Platform=AnyCPU /m