name: Build

on:
  push:
    branches:
      - main   # chạy khi push lên nhánh main

jobs:
  build:
    runs-on: windows-latest   # bắt buộc dùng Windows runner

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.1.1

      - name: Restore NuGet packages
        run: nuget restore Application3.sln

      - name: Build with MSBuild
        run: msbuild Application3.sln /p:Configuration=Release
