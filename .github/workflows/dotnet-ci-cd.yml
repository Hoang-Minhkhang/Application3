name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'   # hoặc 8.0 nếu bạn dùng .NET 8

      - name: Restore NuGet packages
        run: dotnet restore Application3/Application3.csproj

      - name: Build project
        run: dotnet build Application3/Application3.csproj --configuration Release
