name: Build .NET Framework Application3

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Restore NuGet packages
        shell: powershell
        run: |
          Write-Host "Restoring NuGet packages..."
          nuget restore Application3/Application3.csproj -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NuGet restore failed"
            exit 1
          }
          Write-Host "NuGet restore completed successfully"

      - name: Verify PdfiumViewer package
        shell: powershell
        run: |
          $pdfiumPath = "packages/PdfiumViewer.2.13.0.0/lib/net20/PdfiumViewer.dll"
          if (-Not (Test-Path $pdfiumPath)) {
            Write-Error "PdfiumViewer.dll not found at $pdfiumPath"
            Get-ChildItem packages -Filter "PdfiumViewer*" -Recurse
            exit 1
          }
          Write-Host "✓ PdfiumViewer.dll found successfully"

      - name: Build with MSBuild
        run: |
          msbuild Application3/Application3.csproj /p:Configuration=Release /p:Platform=AnyCPU /m