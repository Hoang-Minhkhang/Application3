name: Build

on:
  push:
    branches:
      - main   # chạy khi push lên nhánh main

jobs:
  build:
    runs-on: windows-latest   # bắt buộc dùng Windows runner

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'   # hoặc 8.0 nếu bạn cài .NET 8

      - name: Restore NuGet packages
        run: dotnet restore Application3/Application3.csproj

      - name: Build with MSBuild
        run: msbuild Application3/Application3.csproj /p:Configuration=Release
