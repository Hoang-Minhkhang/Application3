name: Build .NET Framework Application3

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            packages
          key: nuget-packages-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
          restore-keys: |
            nuget-packages-${{ runner.os }}-

      - name: Install NuGet packages (packages.config)
        shell: powershell
        run: |
          Write-Host "Installing packages.config into top-level packages folder"
          nuget install Application3/packages.config -OutputDirectory packages -Source https://api.nuget.org/v3/index.json

      - name: Verify packages folder and PdfiumViewer
        shell: powershell
        run: |
          if (-Not (Test-Path packages)) {
            Write-Error "packages folder not found"
            exit 1
          }
          Write-Host "Top-level packages folder:"
          Get-ChildItem packages | ForEach-Object { Write-Host $_.Name }
          Write-Host "Looking for PdfiumViewer dirs (recursively):"
          Get-ChildItem -Path packages -Filter "PdfiumViewer*" -Recurse -Directory | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Check for DLL exactly where csproj expects:"
          $expected = Join-Path -Path (Resolve-Path Application3) -ChildPath "..\packages\PdfiumViewer.2.13.0.0\lib\net20\PdfiumViewer.dll"
          Write-Host "Expected path (relative to repo): $expected"
          if (-Not (Test-Path $expected)) {
            Write-Warning "Expected PdfiumViewer.dll not found at $expected. See above list to find actual folder name."
          } else {
            Write-Host "Found PdfiumViewer.dll"
          }

      - name: Build with MSBuild
        run: |
          # Platform must match the Platform used in the .csproj Condition (AnyCPU)
          msbuild Application3/Application3.csproj /p:Configuration=Release /p:Platform=AnyCPU /m