name: Build .NET Framework Application3

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Restore NuGet packages with PackagesDirectory
        shell: powershell
        run: |
          Write-Host "Restoring NuGet packages..."
          nuget restore Application3/packages.config -PackagesDirectory packages -Source https://api.nuget.org/v3/index.json -Verbosity detailed
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NuGet restore failed"
            exit 1
          }
          Write-Host "NuGet restore completed successfully"

      - name: Verify packages folder
        shell: powershell
        run: |
          Write-Host "Checking packages folder..."
          if (Test-Path packages) {
            Write-Host "✓ Packages folder exists"
            Get-ChildItem packages | ForEach-Object { Write-Host $_.Name }
          } else {
            Write-Error "packages folder not found"
            exit 1
          }

      - name: Verify PdfiumViewer
        shell: powershell
        run: |
          $pdfiumPath = "packages/PdfiumViewer.2.13.0.0/lib/net20/PdfiumViewer.dll"
          if (Test-Path $pdfiumPath) {
            Write-Host "✓ PdfiumViewer.dll found at $pdfiumPath"
          } else {
            Write-Error "PdfiumViewer.dll NOT found"
            Get-ChildItem packages -Filter "PdfiumViewer*" -Recurse
            exit 1
          }

      - name: Build with MSBuild
        run: |
          msbuild Application3/Application3.csproj /p:Configuration=Release /p:Platform=AnyCPU /m